services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
  backend:
    build: ./server/database
    environment:
      MONGO_URL: mongodb://mongo:27017/dealershipsDB
    depends_on: [mongo]
    restart: on-failure
    ports: ["3030:3030"]
  sentiment:
    build: ./server/djangoapp/microservices
    ports: ["5000:5000"]
  web:
    build: ./server
    environment:
      BACKEND_URL: http://backend:3030
      SENTIMENT_URL: http://sentiment:5000
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-change-before-production}
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on: [backend,sentiment]
    ports: ["8000:8000"]
volumes:
  mongo_data:

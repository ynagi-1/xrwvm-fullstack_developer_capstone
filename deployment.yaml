apiVersion: apps/v1
kind: Deployment
metadata:
  name: bestcars
spec:
  replicas: 1
  selector:
    matchLabels: {app: bestcars}
  template:
    metadata:
      labels: {app: bestcars}
    spec:
      containers:
        - name: web
          image: bestcars:latest
          ports: [{containerPort: 8000}]
          env:
            - {name: BACKEND_URL, value: 'http://backend:3030'}
            - {name: SENTIMENT_URL, value: 'http://sentiment:5000'}
          readinessProbe:
            httpGet: {path: '/', port: 8000}
          resources:
            requests: {cpu: '100m', memory: '128Mi'}
            limits: {cpu: '500m', memory: '512Mi'}
---
apiVersion: v1
kind: Service
metadata: {name: bestcars}
spec:
  selector: {app: bestcars}
  ports: [{port: 8000, targetPort: 8000}]

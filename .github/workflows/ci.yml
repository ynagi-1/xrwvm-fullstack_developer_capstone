name: Best Cars CI/CD
on: [push, pull_request, workflow_dispatch]
jobs:
  test-and-containerize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install Python dependencies
        run: pip install -r server/requirements.txt flake8
      - name: Lint Python for syntax and undefined names
        run: flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=node_modules,build,djangoenv
      - name: Django system checks and tests
        run: cd server && python manage.py check && python manage.py test
      - name: Check Express JavaScript
        run: node --check server/database/app.js
      - name: Install React dependencies
        run: cd server/frontend && npm install --no-audit --no-fund
      - name: Build React
        run: cd server/frontend && CI=true npm run build
      - name: Build deployable Docker image
        run: docker build -t bestcars:latest server
